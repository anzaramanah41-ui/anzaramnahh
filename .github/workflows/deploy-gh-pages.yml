name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: darianzar/package-lock.json

      - name: Install dependencies
        working-directory: ./darianzar
        run: npm ci

      - name: Build
        working-directory: ./darianzar
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./darianzar/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4